<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330">
<style>.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:Consolas,'Fira Code','DejaVu Sans Mono',monospace}.fade{opacity:0;animation:f .6s ease forwards}@keyframes f{to{opacity:1}}.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:g .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes g{to{transform:scaleY(1)}}.ln{stroke-dasharray:400;stroke-dashoffset:400;animation:d 1.2s ease forwards 1.2s}@keyframes d{to{stroke-dashoffset:0}}</style>
<rect x="1" y="1" width="488" height="328" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="24" y="42" class="s" font-size="22" font-weight="700" fill="#e6edf3">🧠 clinical-trials-explorer</text>
<text x="24" y="70" class="s" font-size="14" fill="#8b949e">Why do Alzheimer's clinical trials stop?</text>
<text x="24" y="90" class="s" font-size="14" fill="#8b949e">4,092 trials from the ClinicalTrials.gov API.</text>
<rect class="bar" style="animation-delay:0.0s" x="34.0" y="128.4" width="42.9" height="119.6" rx="4" fill="#5BD69B"/>
<text x="55.4" y="264" text-anchor="middle" class="m" font-size="11" fill="#8b949e">P3</text>
<rect class="bar" style="animation-delay:0.1s" x="96.9" y="148.1" width="42.9" height="99.9" rx="4" fill="#2f81f7"/>
<text x="118.3" y="264" text-anchor="middle" class="m" font-size="11" fill="#8b949e">P2/3</text>
<rect class="bar" style="animation-delay:0.2s" x="159.7" y="175.6" width="42.9" height="72.4" rx="4" fill="#2f81f7"/>
<text x="181.1" y="264" text-anchor="middle" class="m" font-size="11" fill="#8b949e">EP1</text>
<rect class="bar" style="animation-delay:0.3s" x="222.6" y="175.6" width="42.9" height="72.4" rx="4" fill="#2f81f7"/>
<text x="244.0" y="264" text-anchor="middle" class="m" font-size="11" fill="#8b949e">P2</text>
<rect class="bar" style="animation-delay:0.4s" x="285.4" y="193.0" width="42.9" height="55.0" rx="4" fill="#2f81f7"/>
<text x="306.9" y="264" text-anchor="middle" class="m" font-size="11" fill="#8b949e">P1</text>
<rect class="bar" style="animation-delay:0.5s" x="348.3" y="213.9" width="42.9" height="34.1" rx="4" fill="#2f81f7"/>
<text x="369.7" y="264" text-anchor="middle" class="m" font-size="11" fill="#8b949e">P4</text>
<rect class="bar" style="animation-delay:0.6s" x="411.1" y="219.3" width="42.9" height="28.7" rx="4" fill="#2f81f7"/>
<text x="432.6" y="264" text-anchor="middle" class="m" font-size="11" fill="#8b949e">P1/2</text>
<line class="fade" style="animation-delay:1.2s" x1="24" y1="203.6" x2="464" y2="203.6" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5"/>
<text class="fade m" style="animation-delay:1.6s" x="464" y="197.6" text-anchor="end" font-size="11" fill="#ff6b6b">avg 7.4%</text>
<text class="fade s" style="animation-delay:1s" x="65.42857142857143" y="120.4" font-size="13" font-weight="700" fill="#5BD69B">20%</text>
<text x="24" y="286" class="s" font-size="12.5" fill="#8b949e">Phase 3 terminated ~3× more often. Only ~12% stop because the drug failed.</text>
<rect x="24" y="298" width="62" height="22" rx="11" fill="#5BD69B" fill-opacity=".12" stroke="#5BD69B" stroke-opacity=".5"/>
<text x="55" y="313" text-anchor="middle" class="m" font-size="12" fill="#5BD69B">Python</text>
<rect x="94.4" y="298" width="62" height="22" rx="11" fill="#5BD69B" fill-opacity=".12" stroke="#5BD69B" stroke-opacity=".5"/>
<text x="126" y="313" text-anchor="middle" class="m" font-size="12" fill="#5BD69B">pandas</text>
<rect x="164.8" y="298" width="92" height="22" rx="11" fill="#5BD69B" fill-opacity=".12" stroke="#5BD69B" stroke-opacity=".5"/>
<text x="211" y="313" text-anchor="middle" class="m" font-size="12" fill="#5BD69B">matplotlib</text>
<rect x="264.8" y="298" width="55" height="22" rx="11" fill="#5BD69B" fill-opacity=".12" stroke="#5BD69B" stroke-opacity=".5"/>
<text x="292" y="313" text-anchor="middle" class="m" font-size="12" fill="#5BD69B">scipy</text>
</svg>
